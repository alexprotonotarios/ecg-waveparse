standard_6x2_with_r1_ignored:
  description: "6×2 standard layout with one full-width review-only rhythm row"
  layout:
    rows: 6
    cols: 2
  leads:
    - ["I", "V1"]
    - ["II", "V2"]
    - ["III", "V3"]
    - ["aVR", "V4"]
    - ["aVL", "V5"]
    - ["aVF", "V6"]
  # The seventh row is useful layout evidence but must not overwrite one of the
  # primary 12 leads when its identity is uncertain.
  rhythm_leads: []
  total_rows: 7

standard_6x1_limb_constrained:
  description: "Six full-width limb leads cropped from the left 6×2 panel"
  layout:
    rows: 6
    cols: 1
  leads: ["I", "II", "III", "aVR", "aVL", "aVF"]
  rhythm_leads: []
  total_rows: 6

precordial_6x1_constrained:
  description: "Six full-width precordial leads cropped from the right 6×2 panel"
  layout:
    rows: 6
    cols: 1
  leads: ["V1", "V2", "V3", "V4", "V5", "V6"]
  rhythm_leads: []
  total_rows: 6

cabrera_6x1_limb_constrained:
  description: "Six full-width Cabrera limb leads from an independently detected panel"
  layout:
    rows: 6
    cols: 1
  leads: ["aVL", "I", "-aVR", "II", "aVF", "III"]
  rhythm_leads: []
  total_rows: 6

standard_3x4_with_r2:
  description: "3×4 standard layout with two independently identified rhythm rows"
  layout:
    rows: 3
    cols: 4
  leads:
    - ["I", "aVR", "V1", "V4"]
    - ["II", "aVL", "V2", "V5"]
    - ["III", "aVF", "V3", "V6"]
  rhythm_leads: ["Any", "Any"]
  total_rows: 5

standard_3x4_with_r3:
  description: "3×4 standard layout with three independently identified rhythm rows"
  layout:
    rows: 3
    cols: 4
  leads:
    - ["I", "aVR", "V1", "V4"]
    - ["II", "aVL", "V2", "V5"]
    - ["III", "aVF", "V3", "V6"]
  rhythm_leads: ["Any", "Any", "Any"]
  total_rows: 6

cabrera_12x1:
  description: "12×1 Cabrera layout"
  layout:
    rows: 12
    cols: 1
  leads: ["aVL", "I", "-aVR", "II", "aVF", "III", "V1", "V2", "V3", "V4", "V5", "V6"]
  rhythm_leads: []
  total_rows: 12
