name: WaveParse packages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-waveparse-build.txt
      - run: pnpm waveparse:build && python -m build --no-isolation packages/python --outdir dist
      - run: node scripts/audit-waveparse-source.mjs build/waveparse/source dist/source-audit.json
      - run: WAVEPARSE_PYTHON=python pnpm waveparse:verify
      - name: Rebuild the exported source independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/waveparse-source"
          tar -xzf dist/ecg-waveparse-0.1.0-source.tar.gz -C "$RUNNER_TEMP/waveparse-source"
          cd "$RUNNER_TEMP/waveparse-source"
          pnpm install --frozen-lockfile
          pnpm waveparse:build
          python -m build --no-isolation packages/python --outdir dist
          WAVEPARSE_PYTHON=python pnpm waveparse:verify
      - name: Install and verify the runtime
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
          fi
          python -m pip install --no-deps dist/ecg_waveparse-0.1.0-py3-none-any.whl
          python -m ecg_waveparse setup --runtime-dir "$RUNNER_TEMP/waveparse-runtime"
          python -m ecg_waveparse doctor --runtime-dir "$RUNNER_TEMP/waveparse-runtime" --workspace-dir "$RUNNER_TEMP/ecg-results"
      - uses: actions/upload-artifact@v4
        with:
          name: waveparse-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
