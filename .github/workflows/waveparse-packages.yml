name: WaveParse packages
on:
  workflow_dispatch:
  pull_request:
    paths: ['packages/**', 'src/lib/**', 'ecg_pipeline/**', 'ecg_benchmark/**', 'benchmark/suites/**', 'config/**', 'docs/waveparse/**', 'LICENSE*', 'LICENSES/**', 'THIRD_PARTY_NOTICES.md', 'requirements*', 'scripts/*waveparse*', '.github/workflows/waveparse-packages.yml']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-waveparse-build.txt
      - run: pnpm waveparse:build && python -m build --no-isolation packages/python --outdir dist
      - run: node scripts/audit-waveparse-source.mjs build/waveparse/source dist/source-audit.json
      - run: pnpm waveparse:test && python -m unittest scripts.test_waveparse_runtime
      - run: WAVEPARSE_PYTHON=$(command -v python) pnpm waveparse:verify
      - name: Explicit runtime setup and real installed-package inference
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer"
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts "$PWD/dist/ecg-waveparse-0.1.0.tgz"
          python -m pip install --no-deps dist/ecg_waveparse-0.1.0-py3-none-any.whl
          python -m ecg_waveparse setup --runtime-dir "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/engine/.venv/bin/python" scripts/waveparse-runtime-inventory.py --manifest config/waveparse-runtime.json --output "$RUNNER_TEMP/runtime-licences.json"
          "$RUNNER_TEMP/runtime/engine/.venv/bin/python" -m unittest scripts.test_native_grid_digitizer
          "$RUNNER_TEMP/runtime/engine/.venv/bin/python" scripts/test_waveparse_regression_gates.py
          "$RUNNER_TEMP/runtime/engine/.venv/bin/python" scripts/generate_benchmark.py --suite benchmark/suites/smoke.json --output "$RUNNER_TEMP/synthetic"
          node scripts/waveparse-inference-smoke.mjs "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/synthetic/cases/clean/image.png" "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/results" > "$RUNNER_TEMP/inference.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waveparse-${{ matrix.os }}
          path: |
            dist/*
            ${{ runner.temp }}/inference.json
            ${{ runner.temp }}/runtime-licences.json
